<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizForge — Smart Study Worksheet Generator</title>
    <meta name="description" content="Generate multiple choice quizzes from your lecture notes. Study digitally or print worksheets." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.light, html.light body { background-color: #f5f3ff !important; color: #1e1b4b; }
      html.dark, html.dark body { background-color: #0f0a1e !important; color: #e8e0ff; }
      html.ocean, html.ocean body { background-color: #0a1628 !important; color: #e0f2fe; }
      html.forest, html.forest body { background-color: #0a1a0f !important; color: #dcfce7; }
      html.sunset, html.sunset body { background-color: #1a0a0a !important; color: #fef2f2; }
      html.high-contrast, html.high-contrast body { background-color: #000 !important; color: #fff; }
    </style>
    <script>
      (function () {
        function applyTheme(theme) {
          document.documentElement.classList.remove("light", "dark", "ocean", "forest", "sunset", "high-contrast");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        const saved = localStorage.getItem("quizforge-theme");
        applyTheme(saved || "light");
        if (window.self !== window.top) {
          window.addEventListener("message", function (e) {
            if (e.data && typeof e.data.theme === "string") applyTheme(e.data.theme);
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
